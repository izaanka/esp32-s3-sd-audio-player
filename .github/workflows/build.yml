name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build ESP-IDF Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Firmware using ESP-IDF v5.1
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.1.2
          target: esp32s3
          path: '.'

      - name: Create Merged Single Binary
        run: |
          python -m pip install esptool
          python -m esptool --chip esp32s3 merge_bin -o build/esp32s3-sd-audio-player-merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x00000 build/bootloader/bootloader.bin \
            0x08000 build/partition_table/partition-table.bin \
            0x10000 build/sound_test.bin

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-audio-player-binaries
          path: |
            build/esp32s3-sd-audio-player-merged.bin
            build/sound_test.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin

      - name: Upload Binaries to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/esp32s3-sd-audio-player-merged.bin
            build/sound_test.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
